<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{general/fragmentos :: head}"/>
<body>
    <header th:replace="~{general/fragmentos :: header}"></header>
    <main class="container py-4">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <h1>Catálogo de Productos</h1>
            <a th:href="@{/producto/modificar/0}" class="btn btn-primary">Agregar Producto</a>
        </div>

        <section th:replace="~{general/fragmentos :: mostrarToast}"></section>

        <div class="table-responsive">
            <table class="table table-striped table-hover">
                <thead>
                    <tr>
                        <th>ID</th>
                        <th>Nombre</th>
                        <th>Precio</th>
                        <th>Existencias</th>
                        <th>Categoría</th>
                        <th>Acciones</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="producto : ${productos}">
                        <td th:text="${producto.idProducto}"></td>
                        <td th:text="${producto.descripcion}"></td>
                        <td th:text="${#numbers.formatCurrency(producto.precio)}"></td>
                        <td th:text="${producto.existencias}"></td>
                        <td th:text="${producto.categoria != null ? producto.categoria.nombre : 'N/A'}"></td>
                        <td>
                            <a th:href="@{/producto/modificar/{id}(id=${producto.idProducto})}" class="btn btn-sm btn-warning">Editar</a>
                        </td>
                    </tr>
                    <tr th:if="${productos == null or productos.isEmpty()}">
                        <td colspan="6" class="text-center">No hay productos disponibles.</td>
                    </tr>
                </tbody>
            </table>
        </div>
    </main>
    <footer th:replace="~{general/fragmentos :: footer}"></footer>
</body>
</html>
