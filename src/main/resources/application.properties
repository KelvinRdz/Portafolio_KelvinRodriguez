
spring.application.name=tienda

# Para definir el puerto donde escuchará el servidor
server.port=80

# Para definir el formato de fecha y hora en los logs
logging.pattern.dateformat=HH:mm

# Para eliminar mensajes invasivos de Spring
spring.main.banner-mode=off

# En desarrollo el cache del servidor debe ir en false
# En producción normalmente se usa true
spring.thymeleaf.cache=false


 #Conexión local a la BD Techshop en MySQL
 spring.datasource.url=jdbc:mysql://localhost:3306/techshop
 
 #Usuario y clave de creaTablas.sql
 spring.datasource.username=root
 spring.datasource.password=Kelvin0306

 #Driver y plataforma de comunicación
 spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
 spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
 
 #mostrar información en el log
 spring.jpa.properties.hibernate.format_sql=true
 logging.level.org.hibernate.SQL=DEBUG
 logging.level.org.type.descriptor.sql.BasicBinder=TRACE
