# ==========================
# Nombre de la aplicación
# ==========================
spring.application.name=tienda

# ==========================
# Puerto del servidor
# ==========================
server.port=80
# URL base de la aplicación
servidor.http=http://localhost

# ==========================
# Logs
# ==========================
logging.pattern.dateformat=HH:mm
spring.main.banner-mode=off

# ==========================
# Thymeleaf
# ==========================
spring.thymeleaf.cache=false

# ==========================
# Base de datos MySQL
# ==========================
spring.datasource.url=jdbc:mysql://localhost:3306/techshop?useSSL=false&serverTimezone=America/Costa_Rica&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=Kelvin0306
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ==========================
# JPA / Hibernate
# ==========================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.orm.jdbc.bind=TRACE

# ==========================
# Configuración de correo
# ==========================
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=TU_CORREO@gmail.com
spring.mail.password=TU_CONTRASEÑA_DE_APLICACION

spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.default-encoding=UTF-8

# ==========================
# Firebase
# ==========================
firebase.bucket.name=techshop-f9c24.firebasestorage.app
firebase.storage.path=techshop
firebase.json.path=Firebase
